name: Isolated Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux Tcl/Tk libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tk8.6
      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run isolated unittest suite
        run: python scripts/run-tests-isolated.py -v
      - name: Compile Python sources
        run: python -m compileall -q Nexor.py core modules scripts
